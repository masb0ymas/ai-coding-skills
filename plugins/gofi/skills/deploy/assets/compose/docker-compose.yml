# Local or single-host deployment: PostgreSQL 18, a one-shot migration, the
# API, and (separate mode) the SPA in its own nginx image in front of it.
#
#   docker compose up -d --build
#
# Secrets come from .env (APP_SECRET, RESEND_API_KEY, ...); the values below
# only override what differs inside the compose network.

name: __APP__

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: __DB__
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/18/..., so the
      # volume is mounted one level up.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d __DB__"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Applies the embedded migrations once, before the API starts. Safe with
  # several API replicas: only this job migrates.
  migrate:
    build: .
    image: __APP__:local
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DB_DSN: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/__DB__?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    # Same image as migrate; the second build is a cache hit.
    build: .
    image: __APP__:local
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: ${APP_ENV:-production}
      DB_DSN: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/__DB__?sslmode=disable
      MIGRATE_ON_BOOT: "false"
      # Public origin of the API: email links and the Google callback use it.
      AUTH_BASE_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Empty: X-Forwarded-For is ignored and the client IP is the TCP peer.
      # Behind a load balancer, set it to that proxy's IP/CIDR only; a wider
      # range lets anyone inside it fake their IP past the rate limits.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # The SPA and the only way in: the API port is not published, so the API
  # can trust X-Forwarded-For from the compose network alone.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy

# Pinned so TRUSTED_PROXIES can name it. Change COMPOSE_SUBNET if it clashes
# with another network on the host.
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.30.250.0/24}

volumes:
  pgdata:
